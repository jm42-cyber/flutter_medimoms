name: health_services_pro
description: A comprehensive health management system for midwives and healthcare professionals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP & API Communication
  http: ^1.2.0
  dio: ^5.4.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # JSON Serialization
  json_annotation: ^4.8.1

  # Date & Time Formatting
  intl: ^0.19.0

  # File handling
  path_provider: ^2.1.1
  open_file: ^3.3.2

  # Icons
  cupertino_icons: ^1.0.2

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/.env
    - assets/.env.development
    - assets/.env.production

  # Fonts
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1